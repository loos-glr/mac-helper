name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          wget -qO /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Run ShellCheck
        run: |
          shellcheck --shell=bash --severity=warning \
            --exclude=SC2296,SC2154,SC2034,SC2162,SC1090,SC1091,SC2088 \
            setup.sh \
            lib/helpers.sh \
            modules/*.sh

      - name: Check formatting with shfmt
        run: |
          shfmt -d -i 4 \
            setup.sh \
            lib/helpers.sh \
            modules/*.sh

      - name: Zsh syntax check
        run: |
          for f in setup.sh lib/helpers.sh modules/*.sh; do
            echo "Checking: $f"
            zsh -n "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      - name: Check for trailing newlines
        run: |
          missing_nl=0
          for f in setup.sh lib/helpers.sh modules/*.sh; do
            if [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then
              echo "ERROR: $f is missing trailing newline"
              missing_nl=1
            fi
          done
          exit $missing_nl